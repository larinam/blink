name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test and build
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      development_changed: ${{ steps.changes.outputs.changed }}
      development_artifact: ${{ steps.package.outputs.artifact }}
      development_build_id: ${{ steps.package.outputs.build_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Identify changes for the Development download
        id: changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(scripts/development-changes.sh "$BEFORE_SHA")"
          [[ "$changed" == true || "$changed" == false ]]
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check release automation
        run: python3 scripts/test-release-workflows.py

      - name: Run default tests
        shell: bash
        run: |
          set -euo pipefail
          source scripts/toolchain.sh
          swift --version
          swift test

      - name: Build and verify the release bundle
        if: steps.changes.outputs.changed != 'true'
        run: scripts/build.sh release

      - name: Package and verify the Development download
        id: package
        if: steps.changes.outputs.changed == 'true'
        env:
          BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          scripts/package-release.sh --development "$BUILD_ID" "$SOURCE_SHA"
          echo "artifact=development-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Save the verified Development package
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: build/releases/development/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-development:
    name: Publish Development download
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test-and-build.outputs.development_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: development-publish
      cancel-in-progress: false
    steps:
      - name: Check out publication script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this run's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.test-and-build.outputs.development_artifact }}
          path: build/releases/development/

      - name: Publish the rolling Development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BLINK_BUILD_ID: ${{ needs.test-and-build.outputs.development_build_id }}
        run: python3 scripts/publish-development.py build/releases/development
